<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедиаПульс — Календарь</title>
    <!-- Подключаем React и Babel для работы JSX в браузере -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Подключаем Tailwind CSS и Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .day-cell { min-height: 120px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; transition: all 0.2s; }
        .day-cell:hover { background-color: #f8fafc; }
        .post-badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .post-vk { background-color: #E8F2FF; color: #0077FF; border: 1px solid #D0E5FF; }
        .post-tg { background-color: #E3F6FF; color: #0088CC; border: 1px solid #B3E5FF; }
    </style>
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('all');

            return (
                <div className="flex h-screen overflow-hidden bg-white">
                    {/* Sidebar - Navigation & Status */}
                    <aside className="w-72 border-r border-slate-100 flex flex-col bg-[#Fcfdfe]">
                        <div className="p-6">
                            <div className="flex items-center gap-2 mb-8">
                                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-100">
                                    <Icon name="zap" className="text-white" size={18} />
                                </div>
                                <span className="text-lg font-bold tracking-tight">МедиаПульс</span>
                            </div>
                            
                            <nav className="space-y-1 mb-8">
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-2">Статус постов</div>
                                <button className="w-full flex items-center justify-between p-2.5 hover:bg-white hover:shadow-sm rounded-xl transition-all text-slate-600 hover:text-indigo-600 group">
                                    <div className="flex items-center gap-3">
                                        <Icon name="check-circle" size={18} className="group-hover:text-indigo-500" />
                                        <span className="text-sm font-semibold">Опубликованные</span>
                                    </div>
                                    <span className="text-xs font-bold bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">24</span>
                                </button>
                                <button className="w-full flex items-center justify-between p-2.5 bg-white shadow-sm rounded-xl transition-all text-indigo-600">
                                    <div className="flex items-center gap-3">
                                        <Icon name="calendar" size={18} />
                                        <span className="text-sm font-semibold">Запланированные</span>
                                    </div>
                                    <span className="text-xs font-bold bg-indigo-50 px-2 py-0.5 rounded-full text-indigo-600">8</span>
                                </button>
                                <button className="w-full flex items-center justify-between p-2.5 hover:bg-white hover:shadow-sm rounded-xl transition-all text-slate-600 hover:text-amber-600 group">
                                    <div className="flex items-center gap-3">
                                        <Icon name="clock" size={18} className="group-hover:text-amber-500" />
                                        <span className="text-sm font-semibold">На модерации</span>
                                    </div>
                                    <span className="text-xs font-bold bg-amber-50 px-2 py-0.5 rounded-full text-amber-600">3</span>
                                </button>
                            </nav>

                            <div className="space-y-4">
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2">Ближайшие даты</div>
                                
                                {/* Upcoming Post Card */}
                                <div className="p-4 bg-white border border-slate-100 rounded-2xl shadow-sm space-y-3">
                                    <div className="flex justify-between items-start">
                                        <div className="flex gap-2">
                                            <div className="w-6 h-6 bg-blue-50 rounded flex items-center justify-center text-blue-600"><Icon name="message-circle" size={12} /></div>
                                            <span className="text-[11px] font-bold text-slate-400 uppercase">Сегодня, 18:00</span>
                                        </div>
                                    </div>
                                    <div className="text-sm font-semibold text-slate-700 leading-snug">Пост про новые возможности ИИ</div>
                                    <div className="flex gap-2 pt-1">
                                        <button className="flex-1 bg-indigo-600 text-white py-1.5 rounded-lg text-[10px] font-bold hover:bg-indigo-700 transition-colors">Опубликовать</button>
                                        <button className="px-2 bg-slate-50 text-slate-400 rounded-lg hover:bg-slate-100 transition-colors"><Icon name="more-horizontal" size={14} /></button>
                                    </div>
                                </div>

                                <div className="p-4 bg-slate-50/50 border border-dashed border-slate-200 rounded-2xl space-y-3">
                                    <div className="flex gap-2">
                                        <div className="w-6 h-6 bg-sky-50 rounded flex items-center justify-center text-sky-600"><Icon name="send" size={12} /></div>
                                        <span className="text-[11px] font-bold text-slate-400 uppercase">Завтра, 10:00</span>
                                    </div>
                                    <div className="text-sm font-semibold text-slate-400 leading-snug italic">Черновик: Анонс курса</div>
                                    <button className="w-full border border-slate-200 text-slate-500 py-1.5 rounded-lg text-[10px] font-bold hover:bg-white transition-all">На модерацию</button>
                                </div>
                            </div>
                        </div>
                        
                        <div className="mt-auto p-6 border-t border-slate-50 bg-white">
                            <button className="w-full flex items-center gap-3 p-2 text-slate-500 hover:text-indigo-600 transition-colors text-sm font-medium">
                                <Icon name="settings" size={18} /> Настройки
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col bg-white overflow-hidden">
                        {/* Header */}
                        <header className="h-16 border-b border-slate-100 flex items-center justify-between px-8">
                            <div className="flex items-center gap-6">
                                <h2 className="text-lg font-semibold">Апрель 2026</h2>
                                <div className="flex items-center bg-slate-50 rounded-lg p-1">
                                    <button className="p-1.5 hover:bg-white hover:shadow-sm rounded-md transition-all"><Icon name="chevron-left" size={16} /></button>
                                    <button className="p-1.5 hover:bg-white hover:shadow-sm rounded-md transition-all"><Icon name="chevron-right" size={16} /></button>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center bg-slate-50 rounded-lg p-1 mr-2">
                                    <button className="px-4 py-1.5 bg-white shadow-sm rounded-md text-xs font-bold">Месяц</button>
                                    <button className="px-4 py-1.5 text-slate-500 text-xs font-bold">Неделя</button>
                                </div>
                                <button className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition-all flex items-center gap-2">
                                    <Icon name="plus" size={16} /> Создать
                                </button>
                            </div>
                        </header>

                        {/* Calendar Grid */}
                        <div className="flex-1 overflow-y-auto">
                            <div className="calendar-grid border-b border-slate-100 bg-slate-50/30">
                                {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(day => (
                                    <div key={day} className="py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-[0.1em] border-r border-slate-100 last:border-0">{day}</div>
                                ))}
                            </div>
                            <div className="calendar-grid">
                                {[...Array(35)].map((_, i) => {
                                    const day = i - 3; // Смещение для начала месяца
                                    const isCurrentMonth = day > 0 && day <= 30;
                                    return (
                                        <div key={i} className={`day-cell p-3 ${!isCurrentMonth ? 'bg-slate-50/50' : ''}`}>
                                            <div className="flex justify-between items-start mb-2">
                                                <span className={`text-xs font-medium ${day === 25 ? 'bg-indigo-600 text-white w-6 h-6 flex items-center justify-center rounded-full' : 'text-slate-400'}`}>
                                                    {isCurrentMonth ? day : ''}
                                                </span>
                                            </div>
                                            {day === 25 && (
                                                <>
                                                    <div className="post-badge post-vk">
                                                        <Icon name="message-circle" size={10} />
                                                        <span className="truncate">Пост про ИИ</span>
                                                    </div>
                                                    <div className="post-badge post-tg">
                                                        <Icon name="send" size={10} />
                                                        <span className="truncate">Анонс курса</span>
                                                    </div>
                                                </>
                                            )}
                                            {day === 26 && (
                                                <div className="post-badge post-vk opacity-60">
                                                    <Icon name="clock" size={10} />
                                                    <span className="truncate">Черновик</span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
